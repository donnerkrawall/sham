<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sham - Game</title>
    <script src="game.js" defer></script>
       <link rel="stylesheet" href="index.css">
       <link rel="stylesheet" href="gameplay.css">
</head>
<body>
  <div id="languageSwitcher">
    <select id="languageSelect" onchange="setLanguage(this.value)">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </div>
    
     <p id="currentPlayer"></p>
 <div class="flip-card" id="flipCard" onclick="toggleCard()">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <p id="flipInstruction">Flip the card</p>
    </div>
    
    <div class="flip-card-back">
      <p id="theword"></p>
    </div>
  </div>
</div>

<button id="nextButton" onclick="nextPlayer()" style="display:none">Next Person</button>

<p id="end"></p>
</body>
</html>
