<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sham</title>
    <script src="game.js" defer></script>
      <link rel="stylesheet" href="index.css">
    
</head>
<body id="body">
  <div id="languageSwitcher">
    <select id="languageSelect" onchange="setLanguage(this.value)">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </div>
    <input id="name" type="text" placeholder="Insert Player Names" onkeydown="if(event.key==='Enter')submitName()"> <br>
    <button id="submitNameButton" onclick="submitName()">Submit Name</button>
    <br>
    <p id="namesOutput">Current Players: </p>
    <div id="playersList"></div>
    <br>

    <p id="customWordsTitle">Custom Words:</p>
    <div id="customWordsList"></div>
    <input id="wordInput" type="text" placeholder="Insert custom word" onkeydown="if(event.key==='Enter')submitWord()">
    <button id="addWordButton" onclick="submitWord()">Add Word</button>
    <button id="clearWordsButton" onclick="clearCustomWords()">Clear Words</button>
    <br>
    <label id="onlyCustomWordsLabel">
      <input type="checkbox" id="onlyCustomWords" onchange="setOnlyCustomWords(this.checked)">
      <span id="onlyCustomWordsText">Use only my custom words</span>
    </label>
    <br>
    <br>
        <button id="startRoundButton" style="margin-top: 2em;" onclick="startRound()">Get a new Word <br> and Start a Round</button>
       
       
</body>
</html>
